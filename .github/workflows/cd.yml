name: StyleAI CD Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-south1
  ARTIFACT_REGISTRY_REPO: styleai
  CLOUD_RUN_SERVICE: styleai-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3. Install system dependencies & Python packages
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-glx libglib2.0-0
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: 4. Run Lint
        run: ruff check .

      - name: 5. Run Pytest with Coverage
        run: pytest --cov=styleai --cov-report=xml --cov-fail-under=85 tests/

      - name: 6. Build Docker Image
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          docker build -t "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${CLOUD_RUN_SERVICE}:${GIT_SHA}" .

      - name: 7. Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v2
        if: "${{ env.GCP_PROJECT_ID != '' }}"
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        if: "${{ env.GCP_PROJECT_ID != '' }}"

      - name: 8. Push Image to Artifact Registry
        if: "${{ env.GCP_PROJECT_ID != '' }}"
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker push "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${CLOUD_RUN_SERVICE}:${GIT_SHA}"

      - name: 9. Deploy to Cloud Run
        if: "${{ env.GCP_PROJECT_ID != '' }}"
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${CLOUD_RUN_SERVICE}:${GIT_SHA}" \
            --region="${GCP_REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --set-env-vars="GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" \
            --revision-suffix="${GIT_SHA}" \
            --quiet

      - name: 10. Run Post-Deploy Smoke Test
        if: "${{ env.GCP_PROJECT_ID != '' }}"
        id: smoke_test
        run: |
          PUBLIC_URL=$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --region="${GCP_REGION}" --format='value(status.url)')
          bash scripts/smoke_test.sh "${PUBLIC_URL}"

      - name: 11. Rollback on Failure
        if: failure() && steps.smoke_test.outcome == 'failure' && env.GCP_PROJECT_ID != ''
        run: |
          echo "Smoke test failed! Executing rollback..."
          bash scripts/rollback_cloud_run.sh

      - name: 12. Publish Artifacts & Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-summary
          path: coverage.xml
